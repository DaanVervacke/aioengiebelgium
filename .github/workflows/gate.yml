name: Gate

on:
  workflow_call:

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.15"]
        resolution: [highest, lowest-direct]

    continue-on-error: ${{ matrix.python-version == '3.15' }}

    env:
      UV_RESOLUTION: ${{ matrix.resolution }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: true

      - name: Sync dependencies
        run: |
          if [ "${{ matrix.resolution }}" = "lowest-direct" ]; then
            uv lock
          fi
          uv sync --locked --all-groups

      - name: Run check gate
        run: uv run python -m scripts.check

      - name: Build documentation
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Build and verify wheel
        run: |
          uv build
          python -c "import glob, sys, zipfile; w = glob.glob('dist/*.whl')[0]; names = zipfile.ZipFile(w).namelist(); sys.exit(0 if 'aioengiebelgium/py.typed' in names else 'py.typed missing from wheel: ' + w)"
          uv venv /tmp/wheel-smoke
          uv pip install --python /tmp/wheel-smoke/bin/python dist/*.whl
          cd /tmp && /tmp/wheel-smoke/bin/python -c "from aioengiebelgium import EngieBeClient"
