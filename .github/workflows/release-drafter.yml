name: Release Drafter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: release-drafter/release-drafter@72967cdc98ddd3160f1fc3dff619de365e137dd0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
