name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: Breaking changes
    labels: [breaking-change]
  - title: New features
    labels: [new-feature]
  - title: Bug fixes
    labels: [bugfix]
  - title: Enhancements
    labels: [enhancement]
  - title: Maintenance
    labels: [maintenance]
  - title: Documentation
    labels: [documentation]
  - title: Dependency updates
    labels: [dependencies]
    collapse-after: 5
version-resolver:
  # Pre-1.0 semver: breaking changes ship as minor bumps (0.2.0 -> 0.3.0).
  minor:
    labels: [breaking-change, new-feature]
  patch:
    labels: [bugfix, enhancement, maintenance, documentation, dependencies]
  default: patch
template: |
  ## Changes

  $CHANGES
