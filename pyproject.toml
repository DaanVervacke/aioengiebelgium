[build-system]
requires = ["uv_build>=0.12.21,<0.14"]
build-backend = "uv_build"

[project]
name = "aioengiebelgium"
version = "0.8.0"
description = "Unofficial asynchronous Python library to interact with the ENGIE Belgium API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
authors = [{ name = "Daan Vervacke", email = "daan.vervacke@proton.me" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
keywords = [
    "engie",
    "belgium",
    "energy",
    "api",
    "asyncio",
    "aiohttp",
    "epex",
    "home-assistant",
]
dependencies = ["aiohttp>=3.14.3"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "aioresponses>=0.7.9",
    "syrupy>=6.0",
    "mypy>=1.13",
    "ruff>=0.16",
    "coverage[toml]>=7.15.2",
    "pyyaml>=6.0.2",
    "types-pyyaml>=6.0.12",
]
docs = [
    "furo>=2025.12.19",
    "sphinx>=9.1.0",
]

[project.urls]
Homepage = "https://github.com/DaanVervacke/aioengiebelgium"
Repository = "https://github.com/DaanVervacke/aioengiebelgium"
Issues = "https://github.com/DaanVervacke/aioengiebelgium/issues"
Documentation = "https://aioengiebelgium.readthedocs.io/"
Changelog = "https://github.com/DaanVervacke/aioengiebelgium/blob/main/CHANGELOG.md"

[tool.uv]
required-version = ">=0.12.21,<0.14"

[tool.uv.build-backend]
source-include = ["LICENSE"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".claude", ".agents", ".codex", ".continue"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",
    "ISC001",
    "ANN401",
    "PLR0913",
    "PLR0917",
    "TC001",
    "TC002",
    "TC003",
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"scripts/check.py" = ["T201", "S603"]
"scripts/check_bruno_drift.py" = ["T201"]
"docs/conf.py" = ["INP001"]
"tests/**" = [
    "S101",
    "S105",
    "S106",
    "SLF001",
    "PLR2004",
    "RUF059",
]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = [
    "error",
    "ignore:Unclosed client session:ResourceWarning",
    "ignore:Unclosed connector:ResourceWarning",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 98

[tool.mypy]
python_version = "3.14"
strict = true
