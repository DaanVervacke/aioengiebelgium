site_name: aioengiebelgium
site_description: Async Python client for the ENGIE Belgium consumer API
site_url: https://aioengiebelgium.readthedocs.io/
repo_url: https://github.com/DaanVervacke/aioengiebelgium
repo_name: DaanVervacke/aioengiebelgium
docs_dir: documentation
site_dir: site

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Authentication: authentication.md
  - EPEX prices: epex.md
  - API reference: api.md
