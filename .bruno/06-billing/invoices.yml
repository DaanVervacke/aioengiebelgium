info:
  name: Invoices
  type: http
  seq: 4
  tags:
  - data
  - live
http:
  method: GET
  url: '{{billingBaseUrl}}/customer-accounts/{{ENGIE_CAN}}/invoices?pageSize=20&pageNumber=0'
  params:
  - name: pageSize
    value: '20'
    type: query
  - name: pageNumber
    value: '0'
    type: query
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      // Assertions compare derived facts (types, counts, status), never response
      // values: this repo is public and Chai prints both sides of a failure.

      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });
      test("returns a page block", function () {
        const page = res.getBody().page || {};
        expect(typeof page.totalItems).to.equal('number');
      });

      test("returns an items array", function () {
        const value = res.getBody().items;
        expect(Array.isArray(value) ? 'array' : typeof value).to.equal('array');
      });

      test("invoices carry an id and amounts", function () {
        const rows = res.getBody().items || [];
        const malformed = rows.filter(function (i) {
          return !(typeof i.invoiceId === 'string' && typeof i.amount === 'number');
        });
        expect(malformed.length).to.equal(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  One page of the invoices of a customer account, oldest first.

  Mirrors EngieBeClient::async_get_invoices.

  pageSize/pageNumber are the pagination knobs (0-based pageNumber). The
  response carries page metadata, maximumBulkDownloadSize and
  maximumDownloadRequestSize for the bulk endpoints, and per invoice the
  amounts, status, documents (documentId for invoice-document.yml),
  billingPeriodDetails, onlinePayments, paymentReference and dates.
  Parsed by parsers.py. Amounts are asserted by type only.

