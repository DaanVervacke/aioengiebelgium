info:
  name: Budget billing plan
  type: http
  seq: 3
  tags:
  - data
  - live
http:
  method: GET
  url: '{{billingV2BaseUrl}}/business-agreements/{{ENGIE_BAN}}/billing-period-bbp-details'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns the updatable flag", function () {
        expect(typeof res.getBody().budgetBillingPlanUpdatable).to.equal('boolean');
      });

      test("returns per-contract details", function () {
        const value = res.getBody().periodDetailsPerContract;
        expect(Array.isArray(value) ? 'array' : typeof value).to.equal('array');
      });

      test("payment slices carry a date and a status", function () {
        const plan = res.getBody().budgetBillingPlan || {};
        const rows = plan.paymentSlices || [];
        const malformed = rows.filter(function (s) { return !(s.date && s.status); });
        expect(malformed.length).to.equal(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Budget billing plan of the current billing period of one BAN.

  Mirrors EngieBeClient::async_get_budget_billing_plan_details.

  budgetBillingPlan holds the current amount, the amount paid, the
  billing cycle total and paymentSlices. bbpUpdateLimits gives the
  lowest and highest amount the customer can pick. bbpProposal is the
  amount ENGIE proposes, with evaluationContext listing the weighed
  events. Each weight is a decimal string, for example 0E-15.
  periodDetailsPerContract repeats these blocks per energy contract,
  where the payment slices sit under slices instead of paymentSlices.

  A business agreement without an adjustable plan returns only the
  has* flags, budgetBillingPlanUpdatable false and an empty
  periodDetailsPerContract. Slice statuses seen: PAID and NOT_INVOICED.
  Amounts are EUR.

  Parsed by parsers.py into BudgetBillingPlanDetails in models.py.
