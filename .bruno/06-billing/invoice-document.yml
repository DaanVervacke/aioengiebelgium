info:
  name: Invoice document
  type: http
  seq: 5
  tags:
  - data
  - live
http:
  method: GET
  url: '{{billingBaseUrl}}/invoice/700000000001/document'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/pdf
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      // Assertions compare derived facts (types, counts, status), never response
      // values: this repo is public and Chai prints both sides of a failure.

      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });
      test("responds with a PDF", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('pdf');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  PDF download of one invoice. Replace 700000000001 with a live
  invoiceId from invoices.yml.

  Mirrors EngieBeClient::async_get_invoice_document.

  Needs Accept: application/pdf; with the default JSON accept the API
  answers 406. The body is a PDF, so no JSON assertions, only status and
  content type.

