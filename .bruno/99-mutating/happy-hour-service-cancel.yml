info:
  name: Happy Hour service cancel (mutating)
  type: http
  seq: 2
  tags:
  - data
  - mutating
http:
  method: DELETE
  url: '{{businessAgreementsBaseUrl}}/business-agreements/{{ENGIE_BAN}}/happy-hour-service'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: |-
      if (bru.getEnvVar('ENGIE_ALLOW_MUTATING') !== '1') {
        if (req.getExecutionMode() === 'runner') { bru.runner.skipRequest(); }
        else { throw new Error('Set ENGIE_ALLOW_MUTATING to 1 to send this request.'); }
      }
  - type: tests
    code: |-
      test("responds 2xx", function () {
        expect(res.getStatus()).to.be.within(200, 299);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  MUTATING. Cancels the happy hour service of one BAN. Running this
  request changes the customer's ENGIE service.

  Mirrors EngieBeClient::async_cancel_happy_hour_service.

  The pre-request script skips it unless ENGIE_ALLOW_MUTATING is 1, and
  it carries no live tag. Run it only on an account where cancellation
  is intended.

  No request body and no response body. Taken from the ENGIE Smart App
  5.0 API contract. This request has not been run against a live
  account.
