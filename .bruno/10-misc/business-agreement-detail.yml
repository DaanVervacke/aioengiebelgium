info:
  name: Business agreement detail
  type: http
  seq: 1
  tags:
  - data
  - live
http:
  method: GET
  url: '{{businessAgreementsBaseUrl}}/business-agreements/{{ENGIE_BAN}}'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      // Assertions compare derived facts (types, counts, status), never response
      // values: this repo is public and Chai prints both sides of a failure.

      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });
      test("returns a status", function () {
        expect(typeof res.getBody().status).to.equal('string');
      });

      test("returns an addresses block", function () {
        expect(typeof res.getBody().addresses === 'undefined' ? 'missing' : 'present').to.equal('present');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Detail record of one business agreement: status, language, the
  protected-customer flag and the address block (consumption,
  correspondence, meter reading card).

  Mirrors EngieBeClient::async_get_business_agreement.

  Returns an address, so assertions compare structure only. Parsed by
  parsers.py.

