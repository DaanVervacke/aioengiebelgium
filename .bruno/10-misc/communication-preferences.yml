info:
  name: Communication preferences
  type: http
  seq: 2
  tags:
  - data
  - live
http:
  method: GET
  url: '{{communicationsV2BaseUrl}}/customer-accounts/{{ENGIE_CAN}}/communication-preferences'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      // Assertions compare derived facts (types, counts, status), never response
      // values: this repo is public and Chai prints both sides of a failure.

      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });
      test("returns an items array", function () {
        const value = res.getBody().items;
        expect(Array.isArray(value) ? 'array' : typeof value).to.equal('array');
      });

      test("categories carry items with channels", function () {
        const cats = (res.getBody().items[0] || {}).categories || [];
        const bad = cats.filter(function (c) {
          const items = c.items || [];
          return items.some(function (i) { return !Array.isArray(i.channels); });
        });
        expect(bad.length).to.equal(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Notification communication preferences of a customer account, as a
  tree of categories, items and channels (EMAIL, PUSH_NOTIFICATION) with
  per-channel enabled flags.

  Mirrors EngieBeClient::async_get_communication_preferences.

  Parsed by parsers.py.

