info:
  name: Reward balance
  type: http
  seq: 3
  tags:
  - data
  - live
http:
  method: GET
  url: '{{rewardsBaseUrl}}/customer-accounts/{{ENGIE_CAN}}/reward-balance-details'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      // Assertions compare derived facts (types, counts, status), never response
      // values: this repo is public and Chai prints both sides of a failure.

      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });
      test("returns numeric amounts", function () {
        const body = res.getBody();
        expect(typeof body.openAmount).to.equal('number');
        expect(typeof body.payoutThreshold).to.equal('number');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Open reward balance and the payout threshold of a customer account.

  Mirrors EngieBeClient::async_get_reward_balance.

  Returns {openAmount, payoutThreshold} in EUR. Parsed by parsers.py.
  Amounts are asserted by type only.

