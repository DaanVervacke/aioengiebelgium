docs: |-
  EPEX day-ahead wholesale prices, for dynamic-tariff customers.

  These two requests take no BAN, because the market data is identical
  for every customer. Both send a bearer token: the endpoint rejects
  a tokenless call with a 401. See either request for the detail.
