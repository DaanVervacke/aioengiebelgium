info:
  name: Customer account
  type: http
  seq: 2
  tags:
  - data
  - live
http:
  method: GET
  url: '{{accountsBaseUrl}}/customer-accounts/{{ENGIE_CAN}}'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      // Assertions compare derived facts (types, counts, status), never response
      // values: this repo is public and Chai prints both sides of a failure.

      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });
      test("returns a customerAccountNumber", function () {
        expect(typeof res.getBody().customerAccountNumber).to.equal('string');
      });

      test("returns a primaryContact block", function () {
        expect(typeof res.getBody().primaryContact === 'undefined' ? 'missing' : 'present').to.equal('present');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Profile and contact details of one customer account.

  Mirrors EngieBeClient::async_get_customer_account.

  Returns PII: name, birth date, address, email and phone. The assertions
  below compare types only, never values, so nothing personal can reach a
  public CI log.

