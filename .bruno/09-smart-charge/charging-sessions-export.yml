info:
  name: Charging sessions export
  type: http
  seq: 10
  tags:
  - data
  - live
http:
  method: GET
  url: '{{evBaseUrl}}/customer-accounts/{{ENGIE_CAN}}/charging-sessions/export?start={{exportStart}}&end={{exportEnd}}'
  params:
  - name: start
    value: '{{exportStart}}'
    type: query
  - name: end
    value: '{{exportEnd}}'
    type: query
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: '*/*'
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: |-
      // Last 30 days, local zone (UTC on CI).
      const end = new Date();
      const start = new Date(end.getTime() - 30 * 24 * 3600 * 1000);
      const iso = function (d) { return d.toISOString().slice(0, 10); };
      bru.setVar('exportStart', iso(start));
      bru.setVar('exportEnd', iso(end));
  - type: tests
    code: |-
      // Assertions compare derived facts (types, counts, status), never response
      // values: this repo is public and Chai prints both sides of a failure.

      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });
      test("responds with a file content type", function () {
        const ct = String(res.getHeader('content-type') || '');
        expect(ct === 'none' ? 'missing' : 'present').to.equal('present');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Charging sessions of a customer account exported as a file over a
  date range: XLSX by default, CSV with format=CSV.

  Mirrors EngieBeClient::async_export_charging_sessions.

  The start/end query params are required (400 without them) and are
  computed by the pre-request script as the last 30 days. Add
  &format=CSV (and the param entry) for CSV. Accept */* is required, the
  default JSON accept is not satisfiable here. Binary body, so only
  status and content type are asserted.

