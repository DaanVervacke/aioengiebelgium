info:
  name: Vehicle charge settings
  type: http
  seq: 3
  tags:
  - data
  - live
http:
  method: GET
  url: '{{evV2BaseUrl}}/vehicles/{{evVehicleId}}/charge-settings'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns a smart charging flag", function () {
        expect(typeof res.getBody().smartChargingEnabled).to.equal('boolean');
      });

      test("departure times are HH:MM", function () {
        const days = ((res.getBody().departureTimes || {}).currentValue) || {};
        const malformed = Object.values(days).filter(function (v) { return !/^\d{2}:\d{2}$/.test(String(v)); });
        expect(malformed.length).to.equal(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  The Smart Charge settings of one vehicle.

  Mirrors EngieBeClient::async_get_vehicle_charge_settings.

  Needs evVehicleId, which Electric vehicles seeds. The v1 path answers
  404. departureTimes.currentValue holds one HH:MM wall time per
  weekday. batteryReserve and targetBatteryLevel are percentages with
  their allowed range. enable seen: NATIVE. deeplinkOEM was an empty
  string in captures and is not parsed.

  Parsed by parsers.py into VehicleChargeSettings in models.py.
