info:
  name: Latest charging session charge settings
  type: http
  seq: 5
  tags:
  - data
  - live
http:
  method: GET
  url: '{{evV2BaseUrl}}/vehicles/{{evVehicleId}}/charging-sessions/latest/charge-settings'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns a direct flag", function () {
        expect(typeof res.getBody().direct).to.equal('boolean');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  The charge settings of the latest charging session of one vehicle.

  Mirrors EngieBeClient::async_get_latest_charging_session_charge_settings.

  Needs evVehicleId, which Electric vehicles seeds. The v1 path answers
  404. targetBatteryLevel is a percentage. departureTimeOverride is
  ISO-8601 in UTC. direct is true when the session charges at once.

  Parsed by parsers.py into ChargingSessionChargeSettings in models.py.
