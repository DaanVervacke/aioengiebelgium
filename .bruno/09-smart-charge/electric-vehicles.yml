info:
  name: Electric vehicles
  type: http
  seq: 2
  tags:
  - data
  - live
http:
  method: GET
  url: '{{evV2BaseUrl}}/customer-accounts/{{ENGIE_CAN}}/vehicles?includeInactive=true'
  params:
  - name: includeInactive
    value: 'true'
    type: query
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: after-response
    code: |-
      if (bru.getVar('evVehicleId') || bru.getEnvVar('evVehicleId')) {
        console.log('evVehicleId already set, leaving it alone.');
      } else {
        const items = (res.getBody() || {}).items || [];
        const active = items.filter(function (v) { return v.active && v.id; });
        if (active.length === 0) {
          console.log('No active vehicle found. Set evVehicleId by hand.');
        } else {
          bru.setVar('evVehicleId', String(active[0].id));
          console.log('Seeded evVehicleId from active vehicle 1 of ' + active.length + '.');
        }
      }
  - type: tests
    code: |-
      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns a vehicle list", function () {
        const value = res.getBody().items;
        expect(Array.isArray(value) ? 'array' : typeof value).to.equal('array');
      });

      test("vehicles carry a numeric id", function () {
        const rows = res.getBody().items || [];
        const malformed = rows.filter(function (v) { return typeof v.id !== 'number'; });
        expect(malformed.length).to.equal(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  The vehicles of one CAN with capabilities and the last charge state.

  Mirrors EngieBeClient::async_get_electric_vehicles.

  The v1 path answers 404. includeInactive=true is the only value
  captured, so the client always sends it and each vehicle carries an
  active flag. Its after-response script seeds evVehicleId from the
  first active vehicle for the vehicle requests below.

  capabilities holds one isCapable flag per feature, next to
  interventionIds (always empty in captures, not parsed). chargeState
  statuses seen: UNPLUGGED. policyState seen: SCHEDULE. chargePower is
  in kW and range in km.

  Parsed by parsers.py into ElectricVehiclesResponse in models.py.
