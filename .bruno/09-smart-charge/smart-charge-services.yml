info:
  name: Smart Charge services
  type: http
  seq: 1
  tags:
  - data
  - live
http:
  method: GET
  url: '{{evBaseUrl}}/customer-accounts/{{ENGIE_CAN}}/services?type=SMART_CHARGE'
  params:
  - name: type
    value: SMART_CHARGE
    type: query
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns an onboarding flag", function () {
        expect(typeof res.getBody().customerOnboarded).to.equal('boolean');
      });

      test("services carry a type", function () {
        const rows = res.getBody().services || [];
        const malformed = rows.filter(function (s) { return typeof s.type !== 'string'; });
        expect(malformed.length).to.equal(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  The Smart Charge onboarding state and service status of one CAN.

  Mirrors EngieBeClient::async_get_smart_charge_services.

  Only v1 exists for this endpoint. services is empty when the customer
  account was never onboarded. Status seen: ACTIVE. activation is
  ISO-8601 in UTC.

  Parsed by parsers.py into EvServiceInfo in models.py.
