info:
  name: Meter reads
  type: http
  seq: 8
  tags:
  - data
  - live
http:
  method: GET
  url: '{{energyInsightsBaseUrl}}/business-agreements/{{ENGIE_BAN}}/meter-reads?latest=true'
  params:
  - name: latest
    value: 'true'
    type: query
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns items", function () {
        const value = res.getBody().items;
        expect(Array.isArray(value) ? 'array' : typeof value).to.equal('array');
      });

      test("reads carry a date and registers", function () {
        const rows = res.getBody().items || [];
        const malformed = rows.filter(function (i) { return !(i.meterReadDate && Array.isArray(i.registers)); });
        expect(malformed.length).to.equal(0);
      });

      test("registers carry a numeric index", function () {
        const rows = (res.getBody().items || []).reduce(function (all, i) { return all.concat(i.registers || []); }, []);
        const malformed = rows.filter(function (r) { return typeof r.indexRead !== 'number'; });
        expect(malformed.length).to.equal(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Meter register indexes of one BAN.

  Mirrors EngieBeClient::async_get_meter_reads.

  latest=true returns the most recent read per EAN and adds
  minimumIndexReadRange and maximumIndexReadRange to each register.
  startDate and endDate (yyyy-MM-dd) return every read in the range.
  Without parameters the endpoint returns the full read history.

  Origins seen: OFFICIAL and INFORMATIVE. Units seen: KWH and M_3.

  Parsed by parsers.py into MeterReadsResponse in models.py.
