info:
  name: Happy Hour eligibility
  type: http
  seq: 10
  tags:
  - data
  - live
http:
  method: GET
  url: '{{businessAgreementsBaseUrl}}/business-agreements/{{ENGIE_BAN}}/happy-hour-eligibility'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns an eligible flag", function () {
        expect(typeof res.getBody().eligible).to.equal('boolean');
      });

      test("reasons are strings", function () {
        const rows = res.getBody().reasons || [];
        const malformed = rows.filter(function (r) { return typeof r !== 'string'; });
        expect(malformed.length).to.equal(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Whether one BAN can activate the happy hour service.

  Mirrors EngieBeClient::async_get_happy_hour_eligibility.

  reasons is empty when eligible is true. Reason codes seen: OTHER and
  WRONG_CONTRACT_TYPE.

  Parsed by parsers.py into HappyHourEligibility in models.py.
