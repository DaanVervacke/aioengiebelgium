info:
  name: Energy score
  type: http
  seq: 12
  tags:
  - data
  - live
http:
  method: GET
  url: '{{energyInsightsV2BaseUrl}}/business-agreements/{{ENGIE_BAN}}/energy-score?year={{energyScoreYear}}&month={{energyScoreMonth}}'
  params:
  - name: year
    value: '{{energyScoreYear}}'
    type: query
  - name: month
    value: '{{energyScoreMonth}}'
    type: query
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: before-request
    code: |-
      const now = new Date();
      bru.setVar('energyScoreYear', String(now.getFullYear()));
      bru.setVar('energyScoreMonth', String(now.getMonth() + 1));
  - type: tests
    code: |-
      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns a score letter", function () {
        expect(/^[A-E]$/.test(String(res.getBody().score))).to.equal(true);
      });

      test("scoring and actions hold only booleans", function () {
        const body = res.getBody();
        const values = Object.values(body.scoring || {}).concat(Object.values(body.actions || {}));
        const malformed = values.filter(function (v) { return typeof v !== 'boolean'; });
        expect(malformed.length).to.equal(0);
      });

      test("returns electricity data availability", function () {
        const details = res.getBody().details || {};
        const availability = details.consumptionGranularityAvailabilityDetails || {};
        expect(typeof availability.electricity).to.equal('object');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  The app's energy score grade (A to E) for the current month.

  Mirrors EngieBeClient::async_get_energy_score.

  year and month are required. Without them ENGIE answers HTTP 400.
  The app sends month as an integer without zero padding.

  scoring holds the criteria behind the grade. A key is absent when it
  does not count for the contract: sobrietyGas appears only for DUAL
  contracts and hasCheckedMonthlyGraph only for SINGLE ones.
  Some criteria track app use (monthly graph viewed, monthly question
  answered). actions lists what the app suggests to raise the grade.

  details.energyQuestionDetails is absent until the monthly question is
  answered. details.consumptionGranularityAvailabilityDetails has an
  electricity block and, for DUAL contracts, a gas block.

  Parsed by parsers.py into EnergyScore in models.py.
