info:
  name: Billing period usage
  type: http
  seq: 9
  tags:
  - data
  - live
http:
  method: GET
  url: '{{energyInsightsBaseUrl}}/business-agreements/{{ENGIE_BAN}}/billing-period-usage-details'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns a used amount or a failure reason", function () {
        const body = res.getBody();
        const shape = typeof body.usedAmount === 'number' ? 'amount'
          : typeof body.usedAmountFailureReason === 'string' ? 'reason' : 'neither';
        expect(shape).to.not.equal('neither');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Cost used so far in the current billing period of one BAN.

  Mirrors EngieBeClient::async_get_billing_period_usage.

  startDate and endDate bound the billing period. expectedYearInvoice
  and usedAmount are EUR. usedAmountRatio is usedAmount divided by
  expectedYearInvoice, rounded to two decimals.

  When ENGIE cannot compute the cost, the body holds only
  usedAmountFailureReason. MISSING_DATA is the value seen.

  Parsed by parsers.py into BillingPeriodUsage in models.py.
