info:
  name: Happy Hour service status
  type: http
  seq: 11
  tags:
  - data
  - live
http:
  method: GET
  url: '{{businessAgreementsBaseUrl}}/business-agreements/{{ENGIE_BAN}}/happy-hour-service'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns a status", function () {
        expect(typeof res.getBody().status).to.equal('string');
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Status of the happy hour service of one BAN.

  Mirrors EngieBeClient::async_get_happy_hour_service_status.

  Statuses seen: ACTIVE and NOT_ACTIVATED. statusDate is ISO-8601 with
  an explicit offset and is absent when the service was never activated.

  Parsed by parsers.py into HappyHourServiceStatus in models.py.
