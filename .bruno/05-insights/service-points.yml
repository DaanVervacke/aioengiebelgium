info:
  name: Service points
  type: http
  seq: 7
  tags:
  - data
  - live
http:
  method: GET
  url: '{{energyInsightsBaseUrl}}/business-agreements/{{ENGIE_BAN}}/service-points?loadMeteringSourcesStatus=true'
  params:
  - name: loadMeteringSourcesStatus
    value: 'true'
    type: query
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns items", function () {
        const value = res.getBody().items;
        expect(Array.isArray(value) ? 'array' : typeof value).to.equal('array');
      });

      test("service points carry an EAN, a division and data sources", function () {
        const rows = res.getBody().items || [];
        const malformed = rows.filter(function (i) { return !(i.ean && i.division && i.dataSources); });
        expect(malformed.length).to.equal(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Service points of one BAN with their metering data sources.

  Mirrors EngieBeClient::async_get_service_points.

  The Smart App 5.0 calls this instead of the premises service-point
  endpoint. Each item says which data sources exist for the EAN (p1
  dongle, p4 mandate, billing meter regime, meter reads, imv) and how
  far back quarter-hourly and daily measured data reaches.

  loadMeteringSourcesStatus is sent as the app sends it. Captures with
  true, false and without the parameter returned identical bodies.

  Parsed by parsers.py into ServicePointsResponse in models.py. Each
  source's dongleStatus, mandateStatus or status lands in
  MeteringDataSource.status.
