info:
  name: Time-of-use schedules
  type: http
  seq: 4
  tags:
  - data
  - live
http:
  method: GET
  url: '{{billingBaseUrl}}/business-agreements/{{ENGIE_BAN}}/tou-schedules'
  headers:
  - name: User-Agent
    value: Dalvik/2.1.0 (Linux; U; Android 16; Pixel 6 Build/BP4A.251205.006)
  - name: Accept
    value: application/json, application/problem+json
  auth: inherit
runtime:
  scripts:
  - type: tests
    code: |-
      // Assertions compare derived facts (types, counts, status), never response
      // values: this repo is public and Chai prints both sides of a failure.


      test("responds 200", function () {
        expect(res.getStatus()).to.equal(200);
      });

      test("path variables all resolved", function () {
        const raw = req.getUrl();
        // encodeUrl percent-encodes the braces, so an unresolved template
        // arrives as %7B%7B rather than {{. Check both forms.
        const path = raw.replace(/^https?:\/\//, '');
        let problem = 'none';
        if (path.indexOf('//') !== -1) { problem = 'empty path segment'; }
        else if (raw.indexOf('{{') !== -1 || raw.indexOf('%7B%7B') !== -1) {
          problem = 'unresolved variable';
        }
        expect(problem).to.equal('none');
      });

      test("responds with JSON", function () {
        expect(String(res.getHeader('content-type') || '')).to.contain('json');
      });

      test("returns schedules", function () {
        const value = res.getBody().items;
        expect(Array.isArray(value) ? 'array' : typeof value).to.equal('array');
      });

      test("schedules carry eanWithSuffix", function () {
        const rows = res.getBody().items || [];
        const malformed = rows.filter(function (i) { return !(i.eanWithSuffix); });
        expect(malformed.length).to.equal(0);
      });

      test("schedules carry a gridMeterTimeOfUseSchedules list", function () {
        const rows = res.getBody().items || [];
        const malformed = rows.filter(function (i) { return !Array.isArray(i.gridMeterTimeOfUseSchedules); });
        expect(malformed.length).to.equal(0);
      });

      test("every grid meter carries a supplier or dgoTgo schedule", function () {
        const meters = (res.getBody().items || []).flatMap(function (i) { return i.gridMeterTimeOfUseSchedules || []; });
        const malformed = meters.filter(function (m) { return !(m.supplierSchedule || m.dgoTgoSchedule); });
        expect(malformed.length).to.equal(0);
      });

      test("non-empty response ships at least one grid meter", function () {
        const items = res.getBody().items || [];
        if (items.length === 0) { return; }
        const meterCount = items.reduce(function (n, i) { return n + ((i.gridMeterTimeOfUseSchedules || []).length); }, 0);
        expect(meterCount).to.be.greaterThan(0);
      });
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: false
  maxRedirects: 5
docs: |-
  Time-of-use tariff slots per EAN, grid meter, and direction.

  Mirrors EngieBeClient::async_get_tou_schedules.

  Served by the billing microservice (the endpoint the ENGIE Smart App
  calls). The endpoint responds even when the tou-is-active flag is
  false, because the DGO/network schedule applies to every digital-meter
  customer. The flag only gates the supplier-side TOU product.

  parsers.py reads items[].eanWithSuffix and the per-meter
  gridMeterTimeOfUseSchedules[]. Each meter carries a supplierSchedule
  and a dgoTgoSchedule, each a TouSchedule holding offtake / injection
  maps of weekday to a list of slots, plus the per-direction
  optimalTimeslotCode when the wire sends one. Individual slots are
  {startTime, endTime, slotCode, costIndicator} where startTime /
  endTime accept HH:MM or HH:MM:SS and costIndicator is 1 (cheapest) to
  5 (dearest).

  Wire slot codes are uppercase, sometimes direction-prefixed
  (S_TOU1_OFFTAKE_PEAK, S_TOU1_INJECTION_OFFPEAK, HIGH_LOAD_HOURS,
  LOW_LOAD_HOURS, PEAK, OFFPEAK, SUPEROFFPEAK, EXCLUSIVE_NIGHT, DAY,
  TOTAL_HOURS). The parser strips supplier direction prefixes and
  collapses HIGH_LOAD_HOURS / LOW_LOAD_HOURS to peak / offpeak. The
  final lowercase vocabulary is what const.py::TouSlotCode lists.

  When the wire omits optimalTimeslotCode the parser derives it from
  costIndicator: cheapest slot for offtake, dearest for injection.
